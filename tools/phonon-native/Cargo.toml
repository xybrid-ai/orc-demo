[package]
name = "orc-phonon"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
ptts = { version = "=0.4.0-rc.1", features = ["hf"] }
xn = "=0.2.10"

[target.'cfg(target_os = "macos")'.dependencies]
ptts = { version = "=0.4.0-rc.1", features = ["accelerate"] }

[profile.release]
lto = "thin"
